name: CI/CD Pipeline

# WHEN: Run this pipeline when code is pushed to main branch
on:
  push:
    branches:
      - main

jobs:

  # STAGE 1: TEST - Run unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  # STAGE 2: BUILD - Build Docker image and push to Docker Hub
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-demo-app:latest .

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-demo-app:latest

  # STAGE 3: DEPLOY - Deploy to test server
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to server
        run: |
          echo "Deploying to test server..."
          echo "In production, this would SSH into the server and run:"
          echo "  docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-demo-app:latest"
          echo "  docker stop cicd-app && docker rm cicd-app"
          echo "  docker run -d --name cicd-app -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/cicd-demo-app:latest"
          echo "Deployment complete!"
